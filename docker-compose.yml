services:
  frontend-service:
    build:
      context: ./rag-frontend
      dockerfile: Dockerfile
      # next build bakes these into the bundle, so env_file is too late.
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE}
        NEXT_PUBLIC_API_BASE_CHAT: ${NEXT_PUBLIC_API_BASE_CHAT}
    ports:
      - "3000:3000"
    env_file:
      - .env
    networks:
      - microservices-network
    restart: unless-stopped

  users-service:
    build:
      context: .
      dockerfile: users-service/Dockerfile
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - microservices-network
    restart: unless-stopped

  chats-service:
    build:
      context: .
      dockerfile: chats-service/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    ports:
      - "50051:50051"
    env_file:
      - .env
    volumes:
      # Dev document storage; bind-mounted so the worker sees the same files.
      - ./local_data:/app/local_data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - microservices-network
    restart: unless-stopped

  # Consumes the training jobs chats-service publishes; without it documents
  # sit at status='training' forever. Shares .env, the ./local_data mount the
  # API writes uploads to, and host access for Ollama.
  celery-worker:
    build:
      context: .
      dockerfile: chats-service/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    volumes:
      - ./local_data:/app/local_data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - microservices-network
    restart: unless-stopped
    # concurrency=1: Ollama serialises requests anyway, and each extra child
    # would open its own Postgres pool.
    command:
      - celery
      - -A
      - app.helpers.train_document
      - worker
      - --loglevel=info
      - --concurrency=1

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot schema apply before the app services start. queries.sql is
  # idempotent so re-running is a no-op. Not /docker-entrypoint-initdb.d: that
  # only fires on a brand-new volume, silently skipping an existing one.
  db-migrate:
    image: pgvector/pgvector:pg14
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./queries:/queries:ro
    entrypoint: ["/bin/sh", "-c"]
    # Must be a single-element list: compose word-splits a string command, so
    # `sh -c` would receive only the first word as the script.
    command:
      - |
        set -e
        # The healthcheck can pass against initdb's temporary server.
        until pg_isready -h "$$DB_HOST" -p "$$DB_PORT" -U "$$DB_USER" -d "$$DB_NAME" -q; do
          echo "waiting for postgres..."
          sleep 1
        done
        # Non-zero exit blocks the app services starting half-migrated.
        psql -v ON_ERROR_STOP=1 -h "$$DB_HOST" -p "$$DB_PORT" -U "$$DB_USER" -d "$$DB_NAME" -f /queries/queries.sql
    networks:
      - microservices-network
    restart: "no"

  postgres:
    # pgvector build: stock postgres:14 has no vector extension.
    image: pgvector/pgvector:pg14
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: ai_knowledgebase
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - microservices-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_knowledgebase"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  microservices-network:
    driver: bridge

volumes:
  postgres-data:
